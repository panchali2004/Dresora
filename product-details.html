function calculateEndDate() {

    const startDate =
        document.getElementById("startDate").value;

    const days =
        Number(
            document.getElementById("rentalDays").value
        );

    const endDateInput =
        document.getElementById("endDate");


    if (!startDate) {

        endDateInput.value = "";
        return;

    }


    const start =
        new Date(startDate);

    start.setDate(
        start.getDate() + days - 1
    );


    const year =
        start.getFullYear();

    const month =
        String(start.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(start.getDate())
            .padStart(2, "0");


    endDateInput.value =
        `${year}-${month}-${day}`;

}

/* =========================
   CALCULATE TOTAL
========================= */



    function calculateTotal() {

    if (!product) {
        return;
    }

    const startDate =
        document.getElementById("startDate").value;

    const endDate =
        document.getElementById("endDate").value;

    const totalPrice =
        document.getElementById("totalPrice");

    if (!startDate || !endDate) {

        totalPrice.textContent =
            "0";

        return;
    }

    const start =
        new Date(startDate);

    const end =
        new Date(endDate);

    const difference =
        end - start;

    const days =
        Math.ceil(
            difference /
            (1000 * 60 * 60 * 24)
        );

    if (days <= 0) {

        totalPrice.textContent =
            "0";

        return;
    }

   
}


/* =========================
   ADD TO CART
========================= */


 function addToCart() {

    if (!product) {

        alert("Product not found.");

        return;
    }


    /* =========================
       SIZE
    ========================= */

    const selectedSize =
        document.querySelector(
            'input[name="size"]:checked'
        );


    if (!selectedSize) {

        alert(
            "Please select a size first."
        );

        return;
    }


    const size =
        selectedSize.value;


    /* =========================
       DATES
    ========================= */

    const startDate =
        document.getElementById(
            "startDate"
        ).value;


    const endDate =
        document.getElementById(
            "endDate"
        ).value;


    if (!startDate || !endDate) {

        alert(
            "Please select rental start date and end date."
        );

        return;
    }


    const start =
        new Date(startDate);

    const end =
        new Date(endDate);


    const difference =
        end - start;


    const rentalDays =
        Math.ceil(
            difference /
            (1000 * 60 * 60 * 24)
        );


    if (rentalDays <= 0) {

        alert(
            "End date must be after the start date."
        );

        return;
    }


    /* =========================
       TOTAL
    ========================= */

    const totalPrice =
        product.price * rentalDays;


    /* =========================
       CART ITEM
    ========================= */

    const cartItem = {

        id: productId,

        name: product.name,

        category: product.category,

        price: product.price,

        image: product.image,

        size: size,

        startDate: startDate,

        endDate: endDate,

        rentalDays: rentalDays,

        totalPrice: totalPrice

    };


    /* =========================
       GET CART
    ========================= */

    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    /* =========================
       ADD ITEM
    ========================= */

    cart.push(cartItem);


    /* =========================
       SAVE CART
    ========================= */

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    /* =========================
       UPDATE COUNT
    ========================= */

    updateCartCount();


    alert(
        product.name +
        " has been added to your cart."
    );

}

function updateCartCount() {

    const cart =

        document.querySelectorAll(
            ".cart-count"
        );

    cartCounts.forEach(

    );

}
